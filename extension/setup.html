<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页投屏 · TabReach</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="setup.css">
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">↗</span>
        <div>
          <h1>网页投屏</h1>
          <p>发送当前 Edge 标签页</p>
        </div>
      </header>

      <p id="error-message" class="error" role="alert" hidden></p>

      <section id="paired-panel" hidden>
        <p class="success">已连接这台平板</p>
        <p id="paired-address" class="muted"></p>
        <label for="paired-host">平板地址</label>
        <input id="paired-host" autocomplete="off">
        <p class="muted">通常无需修改；只有平板 Wi-Fi 地址变化且无法连接时才需要更新。</p>
        <button id="update-host-button" class="secondary" type="button">保存平板地址</button>
        <button id="start-button" type="button">发送当前标签页</button>
        <button id="forget-button" class="secondary" type="button">忘记这台平板</button>
      </section>

      <form id="pairing-form">
        <div class="qr-wrap">
          <canvas id="pairing-qr" width="224" height="224" aria-label="一次性配对二维码"></canvas>
        </div>
        <p class="muted">在平板的“网页投屏”中点击“连接电脑”，然后扫描此二维码。二维码 60 秒内有效。</p>

        <label for="receiver-address">平板地址</label>
        <input
          id="receiver-address"
          name="receiver-address"
          autocomplete="off"
          value="tabreach.local"
          required>

        <p id="short-code" class="short-code"></p>
        <button id="pair-button" type="submit">完成连接</button>
        <button id="refresh-button" class="secondary" type="button">刷新二维码</button>
      </form>

      <footer>
        <strong>声音仍从 PC 输出</strong>
        <span>不扫描局域网；仅允许固定 .local 或用户输入的私网 IPv4</span>
      </footer>
    </main>
    <script type="module" src="setup.js"></script>
  </body>
</html>
